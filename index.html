<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dice Roller Online — Tabutility</title>
<meta name="description" content="Free online dice roller. Roll D4, D6, D8, D10, D12, D20 and custom dice. Multiple dice, roll history and totals."/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-10deg)}75%{transform:translateY(-8px) rotate(10deg)}}
.rolling{animation:shake 0.6s ease-in-out}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useRef } = React;

const DICE_TYPES = [4,6,8,10,12,20,100];
const DICE_EMOJI = {4:'🔺',6:'⬡',8:'💠',10:'🔷',12:'🔮',20:'⭐',100:'🎲'};

function rollDie(sides) { return Math.floor(Math.random() * sides) + 1; }

function D6Face({ value }) {
  const dots = {
    1:[[50,50]],
    2:[[25,25],[75,75]],
    3:[[25,25],[50,50],[75,75]],
    4:[[25,25],[75,25],[25,75],[75,75]],
    5:[[25,25],[75,25],[50,50],[25,75],[75,75]],
    6:[[25,25],[75,25],[25,50],[75,50],[25,75],[75,75]]
  };
  return (
    <svg width="70" height="70" viewBox="0 0 100 100">
      <rect x="5" y="5" width="90" height="90" rx="14" fill="#1e40af" stroke="#3b82f6" strokeWidth="3"/>
      {(dots[value]||[]).map(([cx,cy],i) => <circle key={i} cx={cx} cy={cy} r="8" fill="#fff"/>)}
    </svg>
  );
}

export default function DiceRoller() {
  const [selected, setSelected] = useState(6);
  const [count, setCount] = useState(2);
  const [results, setResults] = useState([]);
  const [rolling, setRolling] = useState(false);
  const [history, setHistory] = useState([]);
  const [modifier, setModifier] = useState(0);
  const diceRef = useRef(null);

  const roll = () => {
    if (rolling) return;
    setRolling(true);
    setTimeout(() => {
      const rolls = Array.from({length: count}, () => rollDie(selected));
      setResults(rolls);
      const total = rolls.reduce((a,b) => a+b, 0) + modifier;
      setHistory(h => [{dice:`${count}d${selected}`, rolls, total, mod: modifier, time: new Date().toLocaleTimeString()}, ...h.slice(0,14)]);
      setRolling(false);
    }, 650);
  };

  const total = results.reduce((a,b)=>a+b,0) + modifier;
  const max = count * selected + modifier;
  const min = count + modifier;

  return (
    <div style={{maxWidth:620,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Dice Roller</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:32}}>D4 · D6 · D8 · D10 · D12 · D20 · D100 · Custom modifiers</p>

      <div style={{background:'#1e293b',borderRadius:20,padding:'28px 24px',border:'1px solid #334155',marginBottom:20}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center',marginBottom:20}}>
          {DICE_TYPES.map(d => (
            <button key={d} onClick={() => { setSelected(d); setResults([]); }} style={{background:selected===d?'#3b82f6':'#0f172a',color:selected===d?'#fff':'#94a3b8',border:`1px solid ${selected===d?'#3b82f6':'#334155'}`,borderRadius:10,padding:'10px 16px',fontSize:15,fontWeight:700,cursor:'pointer'}}>D{d}</button>
          ))}
        </div>

        <div style={{display:'flex',gap:16,justifyContent:'center',alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
          <label style={{fontSize:14,color:'#94a3b8'}}>Number of dice
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4}}>
              <button onClick={()=>setCount(c=>Math.max(1,c-1))} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,width:32,height:32,fontSize:18,cursor:'pointer'}}>−</button>
              <span style={{fontFamily:'monospace',fontSize:22,fontWeight:700,minWidth:32,textAlign:'center'}}>{count}</span>
              <button onClick={()=>setCount(c=>Math.min(20,c+1))} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,width:32,height:32,fontSize:18,cursor:'pointer'}}>+</button>
            </div>
          </label>
          <label style={{fontSize:14,color:'#94a3b8'}}>Modifier
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4}}>
              <button onClick={()=>setModifier(m=>m-1)} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,width:32,height:32,fontSize:18,cursor:'pointer'}}>−</button>
              <span style={{fontFamily:'monospace',fontSize:22,fontWeight:700,minWidth:40,textAlign:'center',color:modifier>=0?'#22c55e':'#ef4444'}}>{modifier>=0?'+':''}{modifier}</span>
              <button onClick={()=>setModifier(m=>m+1)} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,width:32,height:32,fontSize:18,cursor:'pointer'}}>+</button>
            </div>
          </label>
        </div>

        {results.length > 0 && !rolling && (
          <div style={{textAlign:'center',marginBottom:20}}>
            <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap',marginBottom:16}}>
              {results.map((r,i) => (
                selected === 6 && count <= 6
                  ? <div key={i} style={{filter:`drop-shadow(0 4px 8px rgba(59,130,246,0.5))`}}><D6Face value={r}/></div>
                  : <div key={i} style={{background:'#0f172a',border:'2px solid #3b82f6',borderRadius:14,width:64,height:64,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,fontWeight:800,color:'#f1f5f9'}}>{r}</div>
              ))}
            </div>
            <div style={{fontSize:15,color:'#64748b',marginBottom:4}}>Rolls: {results.join(' + ')}{modifier!==0?(modifier>0?` + ${modifier}`:` − ${Math.abs(modifier)}`):''}</div>
            <div style={{fontSize:40,fontWeight:800,color:'#3b82f6'}}>= {total}</div>
            <div style={{fontSize:13,color:'#475569',marginTop:4}}>Range: {min}–{max}</div>
          </div>
        )}

        {rolling && (
          <div style={{textAlign:'center',marginBottom:20}}>
            <div style={{fontSize:56,marginBottom:8}}>🎲</div>
            <div style={{fontSize:18,color:'#64748b'}}>Rolling…</div>
          </div>
        )}

        <div style={{textAlign:'center'}}>
          <button onClick={roll} disabled={rolling} style={{background:rolling?'#334155':'#3b82f6',color:rolling?'#64748b':'#fff',border:'none',borderRadius:12,padding:'14px 48px',fontSize:18,fontWeight:700,cursor:rolling?'not-allowed':'pointer'}}>
            {rolling ? 'Rolling…' : `Roll ${count}d${selected}${modifier!==0?(modifier>0?`+${modifier}`:modifier):''}` }
          </button>
        </div>
      </div>

      {history.length > 0 && (
        <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155'}}>
          <h2 style={{fontSize:15,fontWeight:600,marginBottom:12}}>Roll History</h2>
          {history.map((h,i) => (
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #0f172a',fontSize:14}}>
              <span style={{color:'#64748b'}}>{h.time}</span>
              <span style={{color:'#94a3b8'}}>{h.dice}{h.mod!==0?(h.mod>0?`+${h.mod}`:h.mod):''}: [{h.rolls.join(', ')}]</span>
              <span style={{fontWeight:700,color:'#3b82f6',fontSize:16}}>{h.total}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DiceRoller />);
//]]>
</script>
</body>
</html>
